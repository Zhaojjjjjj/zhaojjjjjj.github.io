<style>
:root{
  --bg:#ffffff; --ink:#17171c; --ink2:#4c4c56; --muted:#8f8f99;
  --line:#ececf1; --soft:#f7f7f9;
  --accent:#7c3aed; --accent-soft:#f4f0fe; --accent-ink:#5b21b6;
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","PingFang SC","Microsoft YaHei",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:780px;margin:0 auto;padding:0 24px}
a{color:var(--accent-ink);text-decoration:none}
/* header */
.site-head{border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(8px);position:sticky;top:0;z-index:50}
.head-in{display:flex;align-items:center;height:64px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink)}
.brand .avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;display:block}
.brand .name{font-size:17px;font-weight:700;letter-spacing:-.01em}
.nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav a{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 10px;border-radius:10px;color:var(--ink2);font-size:14px;font-weight:500}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a svg{width:18px;height:18px;display:block}
/* footer */
.site-foot{border-top:1px solid var(--line);margin-top:72px}
.foot-in{display:flex;align-items:center;justify-content:center;gap:10px;height:72px;font-size:13px;color:var(--muted)}
.foot-in a{color:var(--muted)}
.foot-in a:hover{color:var(--accent-ink)}
/* chips */
.chip{display:inline-block;font-size:12px;line-height:1;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600;white-space:nowrap;vertical-align:2px}
/* prose : markdown body */
.prose{font-size:16.5px;line-height:1.9;color:var(--ink);overflow-wrap:break-word}
.prose h1,.prose h2,.prose h3,.prose h4{line-height:1.4;letter-spacing:-.015em;margin:2.1em 0 .8em;font-weight:750}
.prose h1{font-size:27px}.prose h2{font-size:23px}.prose h3{font-size:19px}.prose h4{font-size:17px}
.prose h2{padding-bottom:.35em;border-bottom:1px solid var(--line)}
.prose p{margin:1.05em 0}
.prose a{color:var(--accent-ink);border-bottom:1px solid #d9c9f7;transition:border-color .15s}
.prose a:hover{border-bottom-color:var(--accent)}
.prose strong{font-weight:700}
.prose ul,.prose ol{padding-left:1.5em;margin:1.05em 0}
.prose li{margin:.4em 0}
.prose li::marker{color:var(--accent)}
.prose blockquote{margin:1.4em 0;padding:.7em 1.1em;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;color:var(--ink2)}
.prose blockquote p{margin:.5em 0}
.prose code{font-family:var(--mono);font-size:.85em;background:var(--accent-soft);color:var(--accent-ink);padding:2px 7px;border-radius:7px}
.prose pre{background:#f6f6f9;border:1px solid var(--line);border-radius:var(--radius);padding:18px;overflow:auto;position:relative;margin:1.4em 0}
.prose pre code{background:transparent;color:var(--ink);padding:0;border-radius:0;font-size:13.5px;line-height:1.75}
.prose img{max-width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin:1.4em auto}
.prose table{border-collapse:collapse;width:100%;margin:1.4em 0;font-size:14.5px;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--line);padding:9px 14px;text-align:left}
.prose th{background:var(--soft);font-weight:650}
.prose hr{border:none;border-top:1px solid var(--line);margin:2.4em 0}
.prose .g-emoji{font-size:1.15em}
.copybtn{position:absolute;top:10px;right:10px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px;padding:5px 11px;border-radius:8px;cursor:pointer;font-family:var(--font);transition:all .15s}
.copybtn:hover{color:var(--accent-ink);border-color:#d9c9f7}
@media (max-width:640px){
  body{font-size:15px}
  .wrap{padding:0 18px}
  .prose{font-size:15.5px}
  .prose pre{padding:14px}
}
</style>

<style>
.tag-head{padding:56px 0 8px}
.tag-head h1{font-size:29px;letter-spacing:-.02em;margin:0 0 8px;font-weight:780}

.search-row button{height:46px;padding:0 22px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:14.5px;font-weight:650;cursor:pointer;font-family:var(--font)}
.search-row button:hover{background:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.tchip{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;font-family:var(--font)}
.tchip:hover{border-color:var(--accent);color:var(--accent-ink)}

.tchip.on .n{background:rgba(255,255,255,.22);color:#fff}
.results{border-top:1px solid var(--line)}

.result-row .ttl{font-size:16px;font-weight:600;color:var(--ink);flex:1;letter-spacing:-.01em}

.notfound{display:none;padding:40px 0;text-align:center;color:var(--muted);font-size:15px}
@media (max-width:640px){

  .result-row .date{order:2;min-width:0}
  .result-row .ttl{order:1;flex-basis:100%}

<script>
var POSTS=[];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(list){
  var box=document.getElementById('results');
  var nf=document.getElementById('notfound');
  box.innerHTML=list.map(function(p){
    return '<a class="result-row" href="'+p.postUrl+'"><span class="date">'+p.createdDate+'</span><span class="ttl">'+esc(p.postTitle)+'</span></a>';
  }).join('');
  if(!list.length){nf.style.display='block';nf.textContent='没有找到匹配的文章';}
  else{nf.style.display='none';}
}
function setActive(name){
  document.querySelectorAll('.tchip').forEach(function(c){c.classList.toggle('on',c.dataset.tag===name);});
}
function filterTag(name){
  setActive(name);
  document.getElementById('q').value='';
  var t=document.getElementById('tagTitle');
  if(name==='All'){t.textContent='全部文章';document.title='zhaojjjjjj - 标签';render(POSTS);}
  else{t.textContent='标签 · '+name;document.title=name+' - zhaojjjjjj';render(POSTS.filter(function(p){return p.labels.indexOf(name)!==-1;}));}
  if(history.replaceState){history.replaceState(null,'','#'+encodeURIComponent(name));}
}
function doSearch(){
  var q=document.getElementById('q').value.trim();
  setActive('');
  var t=document.getElementById('tagTitle');
  if(!q){t.textContent='全部文章';render(POSTS);return;}
  t.textContent='搜索 · '+q;document.title=q+' - zhaojjjjjj';
  var u=q.toUpperCase();
  render(POSTS.filter(function(p){return p.postTitle.toUpperCase().indexOf(u)!==-1;}));
  if(history.replaceState){history.replaceState(null,'','#'+encodeURIComponent(q));}
}
document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter')doSearch();});
fetch('postList.json').then(function(r){return r.json();}).then(function(d){
  for(var k in d){if(k==='labelColorDict')continue;POSTS.push(d[k]);}
  var counts={'All':POSTS.length};
  POSTS.forEach(function(p){p.labels.forEach(function(l){counts[l]=(counts[l]||0)+1;});});
  var names=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];});
  document.getElementById('chips').innerHTML=names.map(function(n){
    return '<button type="button" class="tchip" data-tag="'+esc(n)+'" onclick="filterTag(\''+n.replace(/'/g,"\\'")+'\')">'+esc(n)+'<span class="n">'+counts[n]+'</span></button>';
  }).join('');
  var init=decodeURIComponent(location.hash.slice(1));
  if(init&&counts[init]!==undefined&&init!=='All'){filterTag(init);}
  else if(init){document.getElementById('q').value=init;doSearch();}
  else{setActive('All');render(POSTS);}
}).catch(function(){document.getElementById('notfound').style.display='block';document.getElementById('notfound').textContent='加载索引失败';});
</script>
