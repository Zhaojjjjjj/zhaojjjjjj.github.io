<!DOCTYPE html>
<html lang="{% if blogBase['i18n']=='CN' %}zh-CN{% elif blogBase['i18n']=='RU' %}ru{% else %}en{% endif %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{{ blogBase['allHead'] }}
<link rel="icon" href="{{ blogBase['faviconUrl'] }}">
<script>(function(){try{var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);}else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
{% block head %}{% endblock %}
<style>
:root{
  --bg:#ffffff; --ink:#131318; --ink2:#45454f; --muted:#8a8a95;
  --line:#e9e9ee; --line2:#dcdce4; --soft:#f7f7f9; --headbg:rgba(255,255,255,.86);
  --accent:#7c3aed; --accent-soft:#f3effe; --accent-ink:#5b21b6; --accent-line:#ddd0fa;
  --codebg:#f7f7f9; --codeink:#26262e;
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","PingFang SC","Microsoft YaHei",monospace;
}
[data-theme="dark"]{
  --bg:#0f0f13; --ink:#f1f1f5; --ink2:#b9b9c4; --muted:#82828e;
  --line:#23232b; --line2:#32323d; --soft:#17171d; --headbg:rgba(15,15,19,.84);
  --accent:#a78bfa; --accent-soft:#221839; --accent-ink:#c9b4fc; --accent-line:#3d2d63;
  --codebg:#17171d; --codeink:#e8e8ee;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .25s ease,color .25s ease}
::selection{background:var(--accent);color:#fff}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
.read{max-width:732px;margin:0 auto}
a{color:var(--accent-ink);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
/* header */
.site-head{border-bottom:1px solid var(--line);background:var(--headbg);backdrop-filter:saturate(1.5) blur(10px);-webkit-backdrop-filter:saturate(1.5) blur(10px);position:sticky;top:0;z-index:60}
.head-in{display:flex;align-items:center;height:62px;gap:8px}
.brand{display:flex;align-items:center;gap:11px;color:var(--ink);flex:none}
.brand .avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;display:block;border:1px solid var(--line)}
.brand .name{font-size:16.5px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.brand .name i{font-style:normal;color:var(--accent)}
.nav{margin-left:auto;display:flex;align-items:center;gap:2px}
.nav a,.theme-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:38px;height:38px;padding:0 10px;border-radius:10px;color:var(--ink2);font-size:14px;font-weight:550;background:none;border:none;cursor:pointer;font-family:var(--font)}
.nav a:hover,.theme-btn:hover{background:var(--soft);color:var(--ink)}
.nav a svg,.theme-btn svg{width:18px;height:18px;display:block}
.theme-btn .sun{display:none}
[data-theme="dark"] .theme-btn .sun{display:block}
[data-theme="dark"] .theme-btn .moon{display:none}
/* footer */
.site-foot{border-top:1px solid var(--line);margin-top:88px}
.foot-in{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:76px;padding-top:14px;padding-bottom:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.foot-in a{color:var(--muted)}
.foot-in a:hover{color:var(--accent-ink)}
.foot-links{display:flex;gap:20px}
.foot-links a{font-weight:550}
/* chips : quiet outline labels */
.chip{display:inline-block;font-size:11.5px;line-height:1;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);font-weight:600;letter-spacing:.02em;white-space:nowrap;background:transparent}
a:hover .chip,.post-row:hover .chip{border-color:var(--accent-line);color:var(--accent-ink)}
/* shared archive list rows */
.rowlist{border-top:1px solid var(--line)}
.post-row{display:grid;grid-template-columns:104px minmax(0,1fr) auto 22px;align-items:baseline;gap:20px;padding:19px 10px;border-bottom:1px solid var(--line);color:var(--ink)}
.post-row .date{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap;letter-spacing:-.01em}
.post-row .ttl{font-size:16.5px;font-weight:600;letter-spacing:-.015em;line-height:1.5;overflow-wrap:break-word}
.post-row:hover .ttl{color:var(--accent-ink)}
.post-row .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.post-row .arr{color:var(--muted);font-size:15px;transition:transform .18s ease,color .18s ease;text-align:right}
.post-row:hover .arr{transform:translateX(3px);color:var(--accent)}
.post-row:hover{background:var(--soft)}
/* prose : markdown body */
.prose{font-size:16.5px;line-height:1.92;color:var(--ink);overflow-wrap:break-word}
.prose h1,.prose h2,.prose h3,.prose h4{line-height:1.42;letter-spacing:-.018em;margin:2.2em 0 .85em;font-weight:760}
.prose h1{font-size:26px}.prose h2{font-size:22.5px}.prose h3{font-size:18.5px}.prose h4{font-size:16.5px}
.prose h2{padding-bottom:.4em;border-bottom:1px solid var(--line)}
.prose p{margin:1.08em 0}
.prose a{color:var(--accent-ink);border-bottom:1px solid var(--accent-line);transition:border-color .15s}
.prose a:hover{border-bottom-color:var(--accent)}
.prose strong{font-weight:700}
.prose ul,.prose ol{padding-left:1.45em;margin:1.08em 0}
.prose li{margin:.42em 0}
.prose li::marker{color:var(--accent);font-weight:600}
.prose blockquote{margin:1.6em 0;padding:.2em 0 .2em 1.15em;border-left:2px solid var(--accent);color:var(--ink2)}
.prose blockquote p{margin:.5em 0}
.prose code{font-family:var(--mono);font-size:.84em;background:var(--accent-soft);color:var(--accent-ink);padding:2px 7px;border-radius:6px}
.prose pre{background:var(--codebg);border:1px solid var(--line);border-radius:12px;padding:20px;overflow:auto;position:relative;margin:1.5em 0}
.prose pre code{background:transparent;color:var(--codeink);padding:0;border-radius:0;font-size:13.5px;line-height:1.78}
.prose img{max-width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin:1.5em auto}
.prose table{border-collapse:collapse;width:100%;margin:1.5em 0;font-size:14.5px;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--line);padding:9px 14px;text-align:left}
.prose th{background:var(--soft);font-weight:650}
.prose hr{border:none;border-top:1px solid var(--line);margin:2.6em 0}
.prose .g-emoji{font-size:1.15em}
.copybtn{position:absolute;top:10px;right:10px;border:1px solid var(--line2);background:var(--bg);color:var(--muted);font-size:12px;padding:5px 11px;border-radius:8px;cursor:pointer;font-family:var(--font);opacity:0;transition:all .15s}
.prose pre:hover .copybtn{opacity:1}
.copybtn:hover{color:var(--accent-ink);border-color:var(--accent-line)}
@media (max-width:640px){
  body{font-size:15px}
  .wrap{padding:0 20px}
  .prose{font-size:15.5px}
  .prose pre{padding:15px}
  .copybtn{opacity:1}
  .post-row{grid-template-columns:minmax(0,1fr) 22px;gap:4px 12px;padding:16px 4px}
  .post-row .date{order:2;grid-column:1}
  .post-row .ttl{order:1;grid-column:1}
  .post-row .tags{order:3;grid-column:1;justify-content:flex-start}
  .post-row .arr{order:1;grid-column:2;grid-row:1}
  .foot-in{justify-content:center;text-align:center}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
}
</style>
{% block style %}{% endblock %}
</head>
<body>
<header class="site-head"><div class="wrap head-in">
  <a class="brand" href="{{ blogBase['homeUrl'] }}"><img class="avatar" src="{{ blogBase['avatarUrl'] }}" alt="avatar"><span class="name">{{ blogBase['displayTitle'] }}<i>.</i></span></a>
  <nav class="nav">{% block nav %}{% endblock %}<button type="button" class="theme-btn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色"><svg class="moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.5A5.8 5.8 0 1 1 6.5 2.5a4.6 4.6 0 0 0 7 7Z"/></svg><svg class="sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"/></svg></button></nav>
</div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer class="site-foot"><div class="wrap">{% include 'footer.html' %}</div></footer>
<script>var IconList={{ IconList }};var utterancesLoad=0;
document.getElementById('themeBtn').addEventListener('click',function(){
  var cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',cur);
  try{localStorage.setItem('theme',cur);}catch(e){}
});</script>
{% block script %}{% endblock %}
</body>
</html>
